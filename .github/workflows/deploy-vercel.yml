name: Deploy Web App to Vercel

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Required because the Vercel project now lives in the `site` subfolder.
      # Store these in GitHub Actions secrets; never commit their values.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Flutter PWA for the same domain
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter pub get
          dart compile js --packages=.dart_tool/package_config.json \
            tool/drift_worker.dart -o /tmp/drift_worker.dart.js
          cp /tmp/drift_worker.dart.js web/drift_worker.dart.js
          python3 - <<'PY'
          from pathlib import Path
          worker = Path('web/drift_worker.dart.js')
          lines = worker.read_text().splitlines()
          worker.write_text('\n'.join(line for line in lines if not line.startswith('//# sourceMappingURL=')) + '\n')
          PY
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' \
            "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env
          flutter build web --release --base-href /app/ \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          mkdir -p site/public/app
          rsync -a --delete --delete-excluded --exclude '.last_build_id' build/web/ site/public/app/

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        working-directory: ./site
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        working-directory: ./site
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        working-directory: ./site
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
