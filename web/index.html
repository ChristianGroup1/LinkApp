<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="إدارة الحضور والاجتماعات والأعضاء والافتقاد للكنائس والخدمات.">
  <meta name="theme-color" content="#0F3D5C">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Link">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Link — إدارة الخدمة</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Host lives above Flutter's glass pane so dismiss clicks always land. -->
  <div id="pwa-install-host"></div>
  <style>
    #pwa-install-host {
      position: fixed !important;
      inset: 0 !important;
      z-index: 2147483647 !important;
      pointer-events: none !important;
    }
    .pwa-install {
      position: absolute !important;
      inset-inline-end: max(16px, env(safe-area-inset-right));
      bottom: max(16px, env(safe-area-inset-bottom));
      width: min(330px, calc(100vw - 32px));
      display: grid;
      gap: 10px;
      padding: 16px;
      padding-inline-end: 44px;
      color: #fff;
      background: #0f3d5c;
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 18px;
      box-shadow: 0 16px 42px rgba(15, 23, 42, .3);
      font-family: Arial, sans-serif;
      text-align: start;
      pointer-events: auto !important;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }
    .pwa-install[hidden] { display: none !important; }
    .pwa-install-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .pwa-install-logo {
      flex: 0 0 auto;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: #fff;
      object-fit: cover;
      pointer-events: none;
    }
    .pwa-install-copy {
      display: grid;
      gap: 4px;
      min-width: 0;
      pointer-events: none;
    }
    .pwa-install strong { font-size: 15px; }
    .pwa-install span { font-size: 13px; line-height: 1.6; opacity: .9; }
    .pwa-install-button {
      width: fit-content;
      margin-top: 3px;
      border: 0;
      border-radius: 10px;
      padding: 9px 13px;
      color: #0f3d5c;
      background: #fff;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      pointer-events: auto !important;
      touch-action: manipulation;
    }
    .pwa-install-close {
      position: absolute;
      top: 4px;
      inset-inline-end: 4px;
      width: 44px;
      height: 44px;
      border: 0;
      color: #fff;
      background: rgba(255, 255, 255, .12);
      border-radius: 12px;
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
      z-index: 2;
      pointer-events: auto !important;
      touch-action: manipulation;
    }
  </style>
  <script>
    (() => {
      const dismissKey = 'link-pwa-install-dismissed';
      const host = document.getElementById('pwa-install-host');
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      const isIos = /iPad|iPhone|iPod/.test(window.navigator.userAgent) && !window.MSStream;
      const flutterSelectors = [
        'flt-glass-pane',
        'flutter-view',
        'flt-scene-host',
        'flt-semantics-host',
        'canvas[flt-renderer]',
        'canvas',
      ].join(',');

      let deferredPrompt = null;
      let dismissed = false;
      let installCard = null;
      let flutterObserver = null;

      try { dismissed = localStorage.getItem(dismissKey) === '1'; } catch (_) {}

      const setFlutterPointers = (enabled) => {
        document.querySelectorAll(flutterSelectors).forEach((el) => {
          if (enabled) {
            el.style.removeProperty('pointer-events');
          } else {
            el.style.setProperty('pointer-events', 'none', 'important');
          }
        });
      };

      const stopWatchingFlutter = () => {
        if (flutterObserver) {
          flutterObserver.disconnect();
          flutterObserver = null;
        }
      };

      const watchFlutter = () => {
        stopWatchingFlutter();
        flutterObserver = new MutationObserver(() => setFlutterPointers(false));
        flutterObserver.observe(document.body, { childList: true, subtree: true });
        setFlutterPointers(false);
      };

      const hideInstall = () => {
        if (installCard) {
          installCard.hidden = true;
          installCard.setAttribute('hidden', '');
        }
        stopWatchingFlutter();
        setFlutterPointers(true);
      };

      const dismissInstall = (event) => {
        if (event) {
          event.preventDefault();
          event.stopPropagation();
          if (typeof event.stopImmediatePropagation === 'function') {
            event.stopImmediatePropagation();
          }
        }
        dismissed = true;
        try { localStorage.setItem(dismissKey, '1'); } catch (_) {}
        hideInstall();
      };

      const ensureCard = () => {
        if (installCard) return installCard;
        installCard = document.createElement('aside');
        installCard.id = 'pwa-install';
        installCard.className = 'pwa-install';
        installCard.setAttribute('aria-live', 'polite');
        installCard.hidden = true;
        installCard.innerHTML = `
          <button id="pwa-install-close" class="pwa-install-close" type="button" aria-label="إخفاء">×</button>
          <div class="pwa-install-row">
            <img class="pwa-install-logo" src="icons/Icon-192.png" width="48" height="48" alt="Link" decoding="async">
            <div class="pwa-install-copy">
              <strong>ثبّت Link على جهازك</strong>
              <span id="pwa-install-message">افتحه كتطبيق مستقل من الشاشة الرئيسية.</span>
            </div>
          </div>
          <button id="pwa-install-button" class="pwa-install-button" type="button">تثبيت التطبيق</button>
        `;
        host.appendChild(installCard);

        const closeButton = installCard.querySelector('#pwa-install-close');
        const installButton = installCard.querySelector('#pwa-install-button');
        const onDismiss = (event) => dismissInstall(event);
        ['pointerdown', 'touchstart', 'click'].forEach((type) => {
          closeButton.addEventListener(type, onDismiss, { capture: true, passive: false });
        });

        installButton.addEventListener('click', async (event) => {
          event.preventDefault();
          event.stopPropagation();
          if (isIos && !deferredPrompt) return;
          if (!deferredPrompt) return;
          deferredPrompt.prompt();
          await deferredPrompt.userChoice;
          deferredPrompt = null;
          dismissInstall();
        }, true);

        return installCard;
      };

      const showInstall = () => {
        if (dismissed || isStandalone) return;
        const card = ensureCard();
        if (isIos) {
          card.querySelector('#pwa-install-message').textContent =
            'على iPhone أو iPad: اضغط زر المشاركة ثم «إضافة إلى الشاشة الرئيسية».';
          card.querySelector('#pwa-install-button').textContent = 'حسناً، فهمت';
          card.querySelector('#pwa-install-button').onclick = (event) => dismissInstall(event);
        }
        card.hidden = false;
        card.removeAttribute('hidden');
        document.documentElement.appendChild(host);
        watchFlutter();
      };

      if (isStandalone || dismissed) {
        hideInstall();
        return;
      }

      // iOS has no beforeinstallprompt — show tip once until dismissed.
      if (isIos) showInstall();

      window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        deferredPrompt = event;
        showInstall();
      });

      window.addEventListener('appinstalled', () => dismissInstall());
      window.addEventListener('flutter-first-frame', () => {
        if (installCard && !installCard.hidden) {
          document.documentElement.appendChild(host);
          setFlutterPointers(false);
        }
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
