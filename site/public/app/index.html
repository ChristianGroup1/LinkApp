<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="إدارة الحضور والاجتماعات والأعضاء والافتقاد للكنائس والخدمات.">
  <meta name="theme-color" content="#0F3D5C">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Link">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Link — إدارة الخدمة</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="app-startup" role="status" aria-live="polite">
    <div class="app-startup-card">
      <img src="icons/Icon-192.png" width="56" height="56" alt="LinkApp" decoding="async">
      <div class="app-startup-spinner" aria-hidden="true"></div>
      <strong>جاري فتح التطبيق</strong>
      <p id="app-startup-message">يرجى الانتظار قليلًا…</p>
      <button id="app-startup-retry" type="button" hidden onclick="window.location.reload()">إعادة المحاولة</button>
    </div>
  </div>
  <style>
    #app-startup {
      position: fixed;
      inset: 0;
      z-index: 2147483000;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      background: #f7f8fc;
      color: #172033;
      font-family: Arial, sans-serif;
      text-align: center;
      transition: opacity 220ms ease, visibility 220ms ease;
    }
    #app-startup.is-ready {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .app-startup-card {
      display: grid;
      justify-items: center;
      gap: 14px;
    }
    .app-startup-card img { border-radius: 16px; }
    .app-startup-card strong { font-size: 19px; }
    .app-startup-card p { margin: 0; color: #697386; line-height: 1.7; }
    .app-startup-spinner {
      width: 34px;
      height: 34px;
      border: 3px solid #dcdcf5;
      border-top-color: #5145cd;
      border-radius: 50%;
      animation: app-startup-spin .8s linear infinite;
    }
    #app-startup-retry {
      border: 0;
      border-radius: 12px;
      padding: 11px 18px;
      color: #fff;
      background: #5145cd;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    @keyframes app-startup-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .app-startup-spinner { animation-duration: 1.8s; }
      #app-startup { transition: none; }
    }
  </style>
  <script>
    (() => {
      const splash = document.getElementById('app-startup');
      const message = document.getElementById('app-startup-message');
      const retry = document.getElementById('app-startup-retry');
      let firstFrameReceived = false;

      const hideSplash = () => {
        if (firstFrameReceived) return;
        firstFrameReceived = true;
        splash.classList.add('is-ready');
        window.setTimeout(() => splash.remove(), 250);
      };

      window.addEventListener('flutter-first-frame', hideSplash, { once: true });
      window.setTimeout(() => {
        if (firstFrameReceived) return;
        message.textContent = 'التشغيل استغرق وقتًا أطول من المعتاد. تحقق من اتصالك ثم أعد المحاولة.';
        retry.hidden = false;
      }, 20000);
    })();
  </script>

  <!-- The banner sits above Flutter without disabling interaction beneath it. -->
  <div id="pwa-install-host"></div>
  <style>
    #pwa-install-host {
      position: fixed !important;
      inset: 0 !important;
      z-index: 2147483647 !important;
      pointer-events: none !important;
    }
    .pwa-install {
      position: absolute !important;
      inset-inline-end: max(16px, env(safe-area-inset-left));
      bottom: max(16px, env(safe-area-inset-bottom));
      box-sizing: border-box;
      width: min(360px, calc(100vw - 24px));
      display: grid;
      gap: 9px;
      padding: 14px;
      padding-inline-end: 52px;
      color: #fff;
      background: #0f3d5c;
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 18px;
      box-shadow: 0 16px 42px rgba(15, 23, 42, .3);
      font-family: Arial, sans-serif;
      text-align: start;
      pointer-events: auto !important;
      touch-action: manipulation;
      overflow-wrap: anywhere;
      -webkit-user-select: none;
      user-select: none;
    }
    .pwa-install[hidden] { display: none !important; }
    .pwa-install-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .pwa-install-logo {
      flex: 0 0 auto;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: #fff;
      object-fit: cover;
      pointer-events: none;
    }
    .pwa-install-copy {
      display: grid;
      gap: 4px;
      min-width: 0;
      pointer-events: none;
    }
    .pwa-install strong { font-size: 15px; }
    .pwa-install span { font-size: 13px; line-height: 1.6; opacity: .9; }
    .pwa-install-button {
      width: fit-content;
      margin-top: 3px;
      border: 0;
      border-radius: 10px;
      padding: 9px 13px;
      color: #0f3d5c;
      background: #fff;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      pointer-events: auto !important;
      touch-action: manipulation;
    }
    .pwa-install-close {
      position: absolute;
      top: 8px;
      inset-inline-end: 8px;
      width: 38px;
      height: 38px;
      border: 0;
      color: #fff;
      background: rgba(255, 255, 255, .12);
      border-radius: 12px;
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
      z-index: 2;
      pointer-events: auto !important;
      touch-action: manipulation;
    }
    @media (max-width: 480px) {
      .pwa-install {
        inset-inline-end: max(12px, env(safe-area-inset-left));
        bottom: max(12px, env(safe-area-inset-bottom));
        width: min(360px, calc(100vw - 24px));
        gap: 8px;
        padding: 13px;
        padding-inline-end: 50px;
        border-radius: 16px;
      }
      .pwa-install-logo { width: 42px; height: 42px; }
      .pwa-install strong { font-size: 14px; }
      .pwa-install span { font-size: 12px; }
      .pwa-install-button { padding: 8px 12px; font-size: 12px; }
    }
  </style>
  <script>
    (() => {
      const host = document.getElementById('pwa-install-host');
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      const isIos = /iPad|iPhone|iPod/.test(window.navigator.userAgent) && !window.MSStream;
      let deferredPrompt = null;
      let dismissed = false;
      let installed = isStandalone;
      let installationCheckComplete = false;
      let installCard = null;

      const hideInstall = () => {
        if (installCard) {
          installCard.hidden = true;
          installCard.setAttribute('hidden', '');
        }
      };

      const dismissInstall = (event) => {
        if (event) {
          event.preventDefault();
          event.stopPropagation();
          if (typeof event.stopImmediatePropagation === 'function') {
            event.stopImmediatePropagation();
          }
        }
        dismissed = true;
        hideInstall();
      };

      const detectInstalledApp = async () => {
        if (isStandalone) return true;
        if (typeof navigator.getInstalledRelatedApps !== 'function') return false;
        try {
          const installedApps = await navigator.getInstalledRelatedApps();
          return installedApps.some((app) => app.platform === 'webapp');
        } catch (_) {
          return false;
        }
      };

      const ensureCard = () => {
        if (installCard) return installCard;
        installCard = document.createElement('aside');
        installCard.id = 'pwa-install';
        installCard.className = 'pwa-install';
        installCard.setAttribute('aria-live', 'polite');
        installCard.hidden = true;
        installCard.innerHTML = `
          <button id="pwa-install-close" class="pwa-install-close" type="button" aria-label="إخفاء">×</button>
          <div class="pwa-install-row">
            <img class="pwa-install-logo" src="icons/Icon-192.png" width="48" height="48" alt="Link" decoding="async">
            <div class="pwa-install-copy">
              <strong>ثبّت Link على جهازك</strong>
              <span id="pwa-install-message">افتحه كتطبيق مستقل من الشاشة الرئيسية.</span>
            </div>
          </div>
          <button id="pwa-install-button" class="pwa-install-button" type="button">تثبيت التطبيق</button>
        `;
        host.appendChild(installCard);

        const closeButton = installCard.querySelector('#pwa-install-close');
        const installButton = installCard.querySelector('#pwa-install-button');
        const onDismiss = (event) => dismissInstall(event);
        ['pointerdown', 'touchstart', 'click'].forEach((type) => {
          closeButton.addEventListener(type, onDismiss, { capture: true, passive: false });
        });

        installButton.addEventListener('click', async (event) => {
          event.preventDefault();
          event.stopPropagation();
          if (!deferredPrompt) {
            dismissInstall(event);
            return;
          }
          deferredPrompt.prompt();
          await deferredPrompt.userChoice;
          deferredPrompt = null;
          dismissInstall();
        }, true);

        return installCard;
      };

      const showInstall = () => {
        if (dismissed || installed || !installationCheckComplete) return;
        const card = ensureCard();
        if (isIos) {
          card.querySelector('#pwa-install-message').textContent =
            'على iPhone أو iPad: اضغط زر المشاركة ثم «إضافة إلى الشاشة الرئيسية».';
          card.querySelector('#pwa-install-button').textContent = 'حسناً، فهمت';
          card.querySelector('#pwa-install-button').onclick = (event) => dismissInstall(event);
        } else if (deferredPrompt) {
          card.querySelector('#pwa-install-message').textContent =
            'ثبّت Link على جهازك للوصول إليه بسرعة من الشاشة الرئيسية.';
          card.querySelector('#pwa-install-button').textContent = 'تثبيت التطبيق';
        } else {
          card.querySelector('#pwa-install-message').textContent =
            'من قائمة المتصفح اختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية». ';
          card.querySelector('#pwa-install-button').textContent = 'حسناً، فهمت';
        }
        card.hidden = false;
        card.removeAttribute('hidden');
        document.documentElement.appendChild(host);
      };

      window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        deferredPrompt = event;
        showInstall();
      });

      detectInstalledApp().then((isInstalled) => {
        installed = isInstalled;
        installationCheckComplete = true;
        if (!installed && !dismissed) showInstall();
      });

      window.addEventListener('appinstalled', () => {
        installed = true;
        dismissInstall();
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
