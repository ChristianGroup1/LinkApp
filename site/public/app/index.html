<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="إدارة الحضور والاجتماعات والأعضاء والافتقاد للكنائس والخدمات.">
  <meta name="theme-color" content="#0F3D5C">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Link">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Link — إدارة الخدمة</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <aside id="pwa-install" class="pwa-install" hidden aria-live="polite">
    <button id="pwa-install-close" class="pwa-install-close" type="button" aria-label="إخفاء">×</button>
    <div class="pwa-install-row">
      <img class="pwa-install-logo" src="icons/Icon-192.png" width="48" height="48" alt="Link" decoding="async">
      <div class="pwa-install-copy">
        <strong>ثبّت Link على جهازك</strong>
        <span id="pwa-install-message">افتحه كتطبيق مستقل من الشاشة الرئيسية.</span>
      </div>
    </div>
    <button id="pwa-install-button" class="pwa-install-button" type="button">تثبيت التطبيق</button>
  </aside>
  <style>
    .pwa-install {
      position: fixed !important;
      z-index: 2147483647 !important;
      inset-inline-end: max(16px, env(safe-area-inset-right));
      bottom: max(16px, env(safe-area-inset-bottom));
      width: min(330px, calc(100vw - 32px));
      display: grid;
      gap: 10px;
      padding: 16px;
      padding-inline-end: 44px;
      color: #fff;
      background: #0f3d5c;
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 18px;
      box-shadow: 0 16px 42px rgba(15, 23, 42, .3);
      font-family: Arial, sans-serif;
      text-align: start;
      pointer-events: auto !important;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }
    .pwa-install[hidden] { display: none !important; }
    .pwa-install-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .pwa-install-logo {
      flex: 0 0 auto;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: #fff;
      object-fit: cover;
      pointer-events: none;
    }
    .pwa-install-copy {
      display: grid;
      gap: 4px;
      min-width: 0;
      pointer-events: none;
    }
    .pwa-install strong { font-size: 15px; }
    .pwa-install span { font-size: 13px; line-height: 1.6; opacity: .9; }
    .pwa-install-button {
      width: fit-content;
      margin-top: 3px;
      border: 0;
      border-radius: 10px;
      padding: 9px 13px;
      color: #0f3d5c;
      background: #fff;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      pointer-events: auto !important;
      touch-action: manipulation;
    }
    .pwa-install-close {
      position: absolute;
      top: 4px;
      inset-inline-end: 4px;
      width: 44px;
      height: 44px;
      border: 0;
      color: #fff;
      background: rgba(255, 255, 255, .12);
      border-radius: 12px;
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
      z-index: 2;
      pointer-events: auto !important;
      touch-action: manipulation;
    }
  </style>
  <script>
    (() => {
      const installCard = document.getElementById('pwa-install');
      const installButton = document.getElementById('pwa-install-button');
      const installMessage = document.getElementById('pwa-install-message');
      const closeButton = document.getElementById('pwa-install-close');
      const dismissKey = 'link-pwa-install-dismissed';
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      const isIos = /iPad|iPhone|iPod/.test(window.navigator.userAgent) && !window.MSStream;
      let deferredPrompt;
      let dismissed = false;

      try { dismissed = localStorage.getItem(dismissKey) === '1'; } catch (_) {}

      const bringToFront = () => {
        document.body.appendChild(installCard);
      };

      const hideInstall = () => {
        installCard.hidden = true;
        installCard.setAttribute('hidden', '');
      };
      const dismissInstall = (event) => {
        if (event) {
          event.preventDefault();
          event.stopPropagation();
          if (typeof event.stopImmediatePropagation === 'function') {
            event.stopImmediatePropagation();
          }
        }
        dismissed = true;
        try { localStorage.setItem(dismissKey, '1'); } catch (_) {}
        hideInstall();
      };
      const showInstall = () => {
        if (dismissed || isStandalone) return;
        bringToFront();
        installCard.hidden = false;
        installCard.removeAttribute('hidden');
      };

      const bindDismiss = (el) => {
        const handler = (event) => dismissInstall(event);
        el.addEventListener('pointerdown', handler, true);
        el.addEventListener('touchstart', handler, { capture: true, passive: false });
        el.addEventListener('click', handler, true);
      };
      bindDismiss(closeButton);

      if (isStandalone) {
        hideInstall();
        return;
      }

      if (isIos) {
        installMessage.textContent = 'على iPhone أو iPad: اضغط زر المشاركة ثم «إضافة إلى الشاشة الرئيسية».';
        installButton.textContent = 'طريقة التثبيت';
        installButton.addEventListener('click', (event) => {
          event.preventDefault();
          event.stopPropagation();
          showInstall();
        }, true);
        showInstall();
      }

      window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        deferredPrompt = event;
        showInstall();
      });

      installButton.addEventListener('click', async (event) => {
        event.preventDefault();
        event.stopPropagation();
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        dismissInstall();
      }, true);

      window.addEventListener('appinstalled', () => dismissInstall());
      window.addEventListener('flutter-first-frame', () => {
        if (!installCard.hidden) bringToFront();
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
