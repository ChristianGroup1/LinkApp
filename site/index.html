<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="تطبيق إدارة الحضور والأعضاء والافتقاد لخدمة الكنيسة">
  <meta name="theme-color" content="#4F46E5">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Link">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Link — إدارة الحضور والافتقاد</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Simple splash shown until Flutter takes over the page. */
    html, body {
      margin: 0;
      height: 100%;
      background: #F8FAFC;
    }
    #boot-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-family: system-ui, sans-serif;
      color: #4F46E5;
    }
    #boot-splash .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid #E0E7FF;
      border-top-color: #4F46E5;
      border-radius: 50%;
      animation: boot-spin 0.9s linear infinite;
    }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="boot-splash">
    <div class="spinner"></div>
    <div>جارٍ تحميل التطبيق…</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Flutter replaces the body content when the first frame renders; this is
    // a safety net for engines that keep pre-existing nodes.
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('boot-splash');
      if (splash) splash.remove();
    });
  </script>
</body>
</html>
